version: 2

models:
  - name: stg_crypto_prices
    description: >
      Incremental current observations keyed by stable record_id. Compares all
      visible source rows, including old dates and processing-time corrections;
      missing source keys remain until full refresh. Not a history table.
    tests: [not_empty]
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: symbol
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('crypto_symbols')
                field: symbol
      - name: price
        tests:
          - not_null
          - positive_value
      - name: source
        tests: [not_null]
      - name: ingest_date
        tests: [not_null]
      - name: bronze_loaded_at
        tests: [not_null]
      - name: silver_loaded_at
        tests: [not_null]
