[project]
name = "crypto-data-platform"
version = "0.1.0"
description = "AWS Data Engineering Pet Project"
requires-python = ">=3.11,<3.12"

dependencies = [
    "boto3==1.43.0",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
    "pyspark==3.5.6",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
