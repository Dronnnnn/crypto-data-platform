version: 2

models:
  - name: stg_crypto_prices
    description: Standardized and defensively filtered table of Spectrum Silver prices.
    tests: [not_empty]
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: symbol
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('crypto_symbols')
                field: symbol
      - name: price
        tests:
          - not_null
          - positive_value
      - name: source
        tests: [not_null]
      - name: ingest_date
        tests: [not_null]
      - name: bronze_loaded_at
        tests: [not_null]
      - name: silver_loaded_at
        tests: [not_null]
